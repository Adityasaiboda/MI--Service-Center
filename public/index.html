<!DOCTYPE html>
<html>
<head>
    <title>MI Service Center Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <img
            src="mi-logo.png"
            alt="MI Logo"
            class="logo">

        <h2>MI Service Center</h2>

        <div class="login-box">

            <input
                type="text"
                id="username"
                placeholder="Username">

            <input
                type="password"
                id="password"
                placeholder="Password">

            <button onclick="login()">
                Login
            </button>

            <p id="message"></p>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
