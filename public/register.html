<div class="container form-container">
<body>

<div class="form-container">


<button class="back-btn"
onclick="location.href='dashboard.html'">

    ← Back to Dashboard

</button>

<h1>📱 Register Service Call</h1>

<form
id="customerForm"
class="service-form">

    <div class="form-group">

        <label>
            Customer Name
        </label>

        <input
        type="text"
        id="customer_name"
        required>

    </div>

    <div class="form-row">

        <div class="form-group">

            <label>
                Phone Number 1
            </label>

            <input
            type="text"
            id="phone1"
            required>

        </div>

        <div class="form-group">

            <label>
                Phone Number 2
            </label>

            <input
            type="text"
            id="phone2">

        </div>

    </div>

    <div class="form-group">

        <label>Email</label>

        <input
        type="email"
        id="email">

    </div>

    <div class="form-group">

        <label>Address</label>

        <textarea
        id="address"></textarea>

    </div>

    <div class="form-row">

        <div class="form-group">

            <label>IMEI Number</label>

            <input
            type="text"
            id="imei"
            required>

        </div>

        <div class="form-group">

            <label>Model Details</label>

            <input
            type="text"
            id="model"
            required>

        </div>

    </div>

    <div class="form-group">

        <label>
            Problem Description
        </label>

        <textarea
        id="problem"></textarea>

    </div>

    <div class="form-row">

        <div class="form-group">

            <label>
                Estimated Cost
            </label>

            <input
            type="number"
            id="estimated_cost">

        </div>

        <div class="form-group">

            <label>
                Advance Received
            </label>

            <input
            type="number"
            id="advance_received">

        </div>

    </div>

    <div class="form-row">

        <div class="form-group">

            <label>
                Advance Payment Mode
            </label>

            <select
            id="advance_payment_mode">

                <option>
                    Cash
                </option>

                <option>
                    UPI
                </option>

                <option>
                    Card
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>
                Entry Date
            </label>

            <input
            type="date"
            id="entry_date">

        </div>

    </div>

    <button
    type="submit"
    class="submit-btn">

        Register Service Call

    </button>

    <p id="message"></p>

</form>


</div>

<script src="script.js"></script>

</body>
