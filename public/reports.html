<!DOCTYPE html>
<html>
<head>
    <title>Daily Collection Report</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Daily Collection Report</h1>

    <button class="back-btn"
    onclick="location.href='dashboard.html'">

        Back to Dashboard

    </button>

    <br><br>

    <div class="report-card">

        <h3>Filter By Date</h3>

        <input
            type="date"
            id="filterDate">

        <button onclick="filterByDate()">
            Search Date
        </button>

    </div>

    <br>

    <div class="report-card">

        <h3>Daily Collection Summary</h3>

        <p>
            Cash Collection:
            ₹<span id="cashTotal">0</span>
        </p>

        <p>
            Online Collection:
            ₹<span id="onlineTotal">0</span>
        </p>

        <p>
            Total Collection:
            ₹<span id="grandTotal">0</span>
        </p>

    </div>

    <div id="dateWiseCustomers">

    </div>

</div>

<script>

const role =
localStorage.getItem("role");

if(role !== "manager"){

    alert("Access Denied");

    window.location.href =
    "/dashboard.html";

}

</script>

<script src="script.js"></script>

</body>
</html>
