<!DOCTYPE html>

<html>
<head>
    <title>MI Service Center Dashboard</title>

```
<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<div class="container">

    <img
        src="mi-logo.png"
        alt="MI Logo"
        class="logo">

    <h1>MI Service Center Dashboard</h1>

    <button
        class="dashboard-btn"
        onclick="location.href='register.html'">

        📱 Register Service Call

    </button>

    <button
        class="dashboard-btn"
        onclick="location.href='search.html'">

        🔍 Search Customer

    </button>

    <button
        class="dashboard-btn"
        onclick="location.href='customers.html'">

        📋 View All Customers

    </button>

    <button
        class="dashboard-btn"
        onclick="location.href='reports.html'">

        📊 Daily Collection Report

    </button>

    <button
        class="dashboard-btn logout-btn"
        onclick="logout()">

        🚪 Logout

    </button>

</div>

<script>

    if(!localStorage.getItem("role")){

        window.location.href =
        "/index.html";

    }

    function logout(){

        localStorage.clear();

        window.location.href =
        "/index.html";

    }

</script>
<script src="script.js"></script>

</body>
</html>
