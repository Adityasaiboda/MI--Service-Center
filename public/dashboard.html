<!DOCTYPE html>

<html>
<head>
    <title>MI Service Center Dashboard</title>
<link rel="stylesheet" href="style.css">

</head>

<body>
<div class="container">

    <img
        src="mi-logo.png"
        alt="MI Logo"
        class="logo">

    <h1>MI Service Center Dashboard</h1>

    <button
        class="dashboard-btn"
        onclick="location.href='register.html'">

        📱 Register Service Call

    </button>

    <button
        class="dashboard-btn"
        onclick="location.href='search.html'">

        🔍 Search Customer

    </button>

    <button
        class="dashboard-btn"
        onclick="location.href='customers.html'">

        📋 View All Customers

    </button>

    <button
        class="dashboard-btn"
        onclick="location.href='reports.html'">

        📊 Daily Collection Report

    </button>

    <button
        class="dashboard-btn logout-btn"
        onclick="logout()">

        🚪 Logout

    </button>

</div>

<script>

const role =
localStorage.getItem("role");

const menu =
document.getElementById(
    "menuContainer"
);

if(role === "frontdesk"){

    menu.innerHTML = `

        <button class="dashboard-btn"
        onclick="location.href='register.html'">
            📱 Register Service Call
        </button>

        <button class="dashboard-btn"
        onclick="location.href='search.html'">
            🔍 Search Customer
        </button>

    `;

}

else if(role === "technician"){

    menu.innerHTML = `

        <button class="dashboard-btn"
        onclick="location.href='search.html'">
            🔍 Search Customer
        </button>

    `;

}

else if(role === "manager"){

    menu.innerHTML = `

        <button class="dashboard-btn"
        onclick="location.href='register.html'">
            📱 Register Service Call
        </button>

        <button class="dashboard-btn"
        onclick="location.href='search.html'">
            🔍 Search Customer
        </button>

        <button class="dashboard-btn"
        onclick="location.href='customers.html'">
            📋 View All Customers
        </button>

        <button class="dashboard-btn"
        onclick="location.href='reports.html'">
            📊 Daily Collection Report
        </button>

    `;

}

else{

    window.location.href =
    "/index.html";

}

function logout(){

    localStorage.clear();

    window.location.href =
    "/index.html";

}

</script>


</body>
</html>
